name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Keep package.json version in sync with tweakctl
        working-directory: tweakctl
        run: |
          V=$(grep -oP 'VERSION = "\K[^"]+' tweakctl)
          npm version "$V" --no-git-tag-version --allow-same-version

      - name: Publish
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: tweakctl
        run: npm publish --access public

      - name: Skipped (no NPM_TOKEN secret)
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "Set the NPM_TOKEN repository secret to enable 'npm i -g tweakctl'."
