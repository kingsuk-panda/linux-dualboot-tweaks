name: Build packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          mkdir -p deb/usr/local/bin deb/usr/share/applications deb/DEBIAN
          cp tweakctl/tweakctl tweakctl/tweakctl-gui deb/usr/local/bin/
          chmod 755 deb/usr/local/bin/tweakctl deb/usr/local/bin/tweakctl-gui
          cp tweakctl/tweakctl-gui.desktop deb/usr/share/applications/
          cp tweakctl/packaging/deb-control deb/DEBIAN/control
          sed -i "s/^Version:.*/Version: $VER/" deb/DEBIAN/control
          dpkg-deb --build deb tweakctl_${VER}_all.deb
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: tweakctl_*.deb }

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rpm-build
        run: dnf install -y rpm-build
      - name: Build .rpm
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          mkdir -p rpmbuild/{SOURCES,SPECS,BUILD,RPMS,SRPMS}
          cp tweakctl/tweakctl tweakctl/tweakctl-gui tweakctl/tweakctl-gui.desktop rpmbuild/SOURCES/
          sed "s/^Version:.*/Version:        $VER/" tweakctl/packaging/tweakctl.spec > rpmbuild/SPECS/tweakctl.spec
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/tweakctl.spec
      - uses: actions/upload-artifact@v4
        with: { name: rpm, path: rpmbuild/RPMS/noarch/*.rpm }

  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install base-devel + tk
        run: pacman -Sy --noconfirm base-devel tk
      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "cd tweakctl/packaging && makepkg -sfC --noconfirm"
      - uses: actions/upload-artifact@v4
        with: { name: archpkg, path: tweakctl/packaging/*.pkg.tar.zst }

  build-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk python3-pip wget
          pip3 install --user pyinstaller
      - name: Build binaries with PyInstaller
        run: |
          ~/.local/bin/pyinstaller --onefile --name tweakctl tweakctl/tweakctl
          ~/.local/bin/pyinstaller --onefile --name tweakctl-gui tweakctl/tweakctl-gui
      - name: Assemble AppDir
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          mkdir -p AppDir/usr/bin
          cp dist/tweakctl dist/tweakctl-gui AppDir/usr/bin/
          python3 - <<'PYEOF'
          import zlib, struct
          W = H = 256
          rows = b''
          for y in range(H):
              rows += b'\x00'
              for x in range(W):
                  cx, cy = x - 128, y - 128
                  if cx*cx + cy*cy < 120*120:
                      rows += bytes((46, 204, 113))
                  else:
                      rows += bytes((30, 30, 46))
          def chunk(t, d):
              c = struct.pack('>I', len(d)) + t + d
              return c + struct.pack('>I', zlib.crc32(t + d))
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', W, H, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(rows))
          png += chunk(b'IEND', b'')
          open('AppDir/tweakctl.png', 'wb').write(png)
          PYEOF
          cat > AppDir/tweakctl.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=tweakctl
          Comment=Hibernation, S3 sleep, Plymouth boot splash and ctOS sounds
          Exec=tweakctl
          Icon=tweakctl
          Categories=System;
          Terminal=false
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/tweakctl" "$@"
          EOF
          chmod +x AppDir/AppRun
      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
      - name: Build AppImage
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          ARCH=x86_64 VERSION="$VER" ./appimagetool --appimage-extract-and-run AppDir
          mv tweakctl-${VER}-x86_64.AppImage tweakctl-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: tweakctl-x86_64.AppImage }

  release:
    needs: [build-debian, build-rpm, build-arch, build-appimage]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/deb/*
            artifacts/rpm/*
            artifacts/archpkg/*
            artifacts/appimage/*
