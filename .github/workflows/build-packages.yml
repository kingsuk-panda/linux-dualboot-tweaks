name: Build packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Tag version matches app version
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          APP="$(grep -oP 'VERSION = "\K[^"]+' tweakctl/tweakctl)"
          GUI="$(grep -oP 'VERSION = "\K[^"]+' tweakctl/tweakctl-gui)"
          NPM="$(grep -oP '"version": "\K[^"]+' tweakctl/package.json)"
          echo "tag=$VER  tweakctl=$APP  gui=$GUI  npm=$NPM"
          if [ "$VER" != "$APP" ] || [ "$VER" != "$GUI" ] || [ "$VER" != "$NPM" ]; then
            echo "::error::Version mismatch! Run ./bump-version.sh $VER --tag so the tag and all files agree."
            exit 1
          fi

  build-debian:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          mkdir -p deb/usr/local/bin deb/usr/share/applications deb/usr/share/icons/hicolor/256x256/apps deb/DEBIAN
          cp tweakctl/tweakctl tweakctl/tweakctl-gui deb/usr/local/bin/
          chmod 755 deb/usr/local/bin/tweakctl deb/usr/local/bin/tweakctl-gui
          cp tweakctl/tweakctl-gui.desktop deb/usr/share/applications/
          cp tweakctl/tweakctl.png deb/usr/share/icons/hicolor/256x256/apps/tweakctl.png
          cp tweakctl/packaging/deb-control deb/DEBIAN/control
          sed -i "s/^Version:.*/Version: $VER/" deb/DEBIAN/control
          dpkg-deb --build deb tweakctl_${VER}_all.deb
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: tweakctl_*.deb }

  build-rpm:
    needs: check
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rpm-build
        run: dnf install -y rpm-build
      - name: Build .rpm
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          mkdir -p rpmbuild/{SOURCES,SPECS,BUILD,RPMS,SRPMS}
          cp tweakctl/tweakctl tweakctl/tweakctl-gui tweakctl/tweakctl-gui.desktop tweakctl/tweakctl.png rpmbuild/SOURCES/
          sed "s/^Version:.*/Version:        $VER/" tweakctl/packaging/tweakctl.spec > rpmbuild/SPECS/tweakctl.spec
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/tweakctl.spec
      - uses: actions/upload-artifact@v4
        with: { name: rpm, path: rpmbuild/RPMS/noarch/*.rpm }

  build-arch:
    needs: check
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install base-devel + tk
        run: pacman -Sy --noconfirm base-devel tk
      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "cd tweakctl/packaging && makepkg -sfC --noconfirm"
      - uses: actions/upload-artifact@v4
        with: { name: archpkg, path: tweakctl/packaging/*.pkg.tar.zst }

  build-appimage:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk python3-pip wget
          pip3 install --user pyinstaller
      - name: Build binaries with PyInstaller
        run: |
          ~/.local/bin/pyinstaller --onefile --name tweakctl tweakctl/tweakctl
          ~/.local/bin/pyinstaller --onefile --name tweakctl-gui \
            --add-data "tweakctl/tweakctl:tweakctl" \
            --add-data "tweakctl/tweakctl.png:tweakctl" \
            --hidden-import urllib.request --hidden-import json \
            tweakctl/tweakctl-gui
      - name: Assemble AppDir
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          mkdir -p AppDir/usr/bin
          cp dist/tweakctl dist/tweakctl-gui AppDir/usr/bin/
          cp tweakctl/tweakctl.png AppDir/tweakctl.png
          cat > AppDir/tweakctl.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Tweakctl
          GenericName=System Tweaks
          Comment=Hibernation, S3 sleep, Plymouth boot splash and ctOS sounds
          Exec=tweakctl
          Icon=tweakctl
          Categories=System;
          Terminal=false
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/tweakctl" "$@"
          EOF
          chmod +x AppDir/AppRun
      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
      - name: Build AppImage
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          ARCH=x86_64 VERSION="$VER" ./appimagetool --appimage-extract-and-run AppDir
          # appimagetool names the file after the desktop entry's Name
          # ("Tweakctl-<ver>-x86_64.AppImage"); the download URL must stay
          # lowercase, so rename whatever it produced:
          mv *-"${VER}"-x86_64.AppImage tweakctl-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: tweakctl-x86_64.AppImage }

  publish-npm:
    needs: check
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && secrets.NPM_TOKEN != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to npm
        working-directory: tweakctl
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-aur:
    needs: check
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && secrets.AUR_SSH_KEY != ''
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
      - name: Push to AUR
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/aur -o StrictHostKeyChecking=no"
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          git clone ssh://aur@aur.archlinux.org/tweakctl.git aur-tmp
          cd aur-tmp
          sed "s/^pkgver=.*/pkgver=$VER/" ../tweakctl/packaging/PKGBUILD > PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          git config user.name "kingsuk-panda"
          git config user.email "kingsuk.panda.2004@gmail.com"
          git add PKGBUILD
          git diff --cached --quiet || git commit -m "v$VER"
          git push

  release:
    needs: [build-debian, build-rpm, build-arch, build-appimage]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Release notes from CHANGELOG.md
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section for v$VER — release notes would be empty."
            exit 1
          fi
          head -5 release-notes.md
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/deb/*
            artifacts/rpm/*
            artifacts/archpkg/*
            artifacts/appimage/*
